services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gra_evat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - gra_evat_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gra_evat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gra_evat_postgres:
