$kind: http-example
name: PostgreSQL is unavailable or enabled GRA integration is not ready.
request:
  url: "{{baseUrl}}/api/v1/health/ready"
  method: GET
  headers:
    Accept: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "not_ready",
        "database": "healthy",
        "gra": "not_configured",
        "timestamp": "2018-10-08T06:36:38.468Z",
        "graErrorCode": "string"
      }
order: 2000
