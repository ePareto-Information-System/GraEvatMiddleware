$kind: http-example
name: Credential created. The API key is returned once.
request:
  url: "{{baseUrl}}/api/v1/admin/tenants/:tenantId/credentials"
  method: POST
  headers:
    - key: X-Admin-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: tenantId
      value: 40615893-5fb7-b2e1-835d-8fcbba8d3a00
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "credentialId": "af0b7484-fa97-d6ae-2ca1-8b1d5088bd05",
        "apiKey": "string",
        "keyPrefix": "string",
        "createdAt": "2013-03-06T11:18:03.192Z"
      }
order: 1000
