$kind: http-example
name: Tenant and initial API credential created. The API key is returned once.
request:
  url: "{{baseUrl}}/api/v1/admin/tenants"
  method: POST
  headers:
    - key: X-Admin-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "string",
        "slug": "3fv07v75lycv8o0xw9bugo4en8med2iucgh",
        "taxpayerReference": "string",
        "graSecurityKeySecretName": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tenantId": "19df22d9-e0bf-0d00-4a3a-ac55f77bf042",
        "name": "string",
        "slug": "string",
        "status": "string",
        "credential": {
          "credentialId": "19e9c5b8-e8cf-68dc-f807-d32929de77af",
          "apiKey": "string",
          "keyPrefix": "string",
          "createdAt": "1953-03-25T10:36:43.277Z"
        }
      }
order: 1000
