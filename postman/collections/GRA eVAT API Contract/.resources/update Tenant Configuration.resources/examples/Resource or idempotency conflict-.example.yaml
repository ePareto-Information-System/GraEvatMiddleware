    - key: tenantId
      value: 40615893-5fb7-b2e1-835d-8fcbba8d3a00
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "taxpayerReference": "string",
        "graSecurityKeySecretName": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 4000
