$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/transactions/:transactionId'
order: 7000
headers:
  - { key: X-API-Key, value: '{{tenantApiKey}}' }
pathVariables:
  - { key: transactionId, value: '{{transactionId}}' }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Transaction lookup returns HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Lookup returns the submitted transaction', () => pm.expect(pm.response.json().transactionId).to.eql(pm.collectionVariables.get('transactionId')));
