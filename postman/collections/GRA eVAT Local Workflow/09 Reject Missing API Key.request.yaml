$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/transactions/:transactionId'
order: 9000
pathVariables:
  - { key: transactionId, value: '{{transactionId}}' }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Missing API key returns HTTP 401', () => pm.response.to.have.status(401));
      pm.test('Authentication failure has a stable code', () => pm.expect(pm.response.json().code).to.eql('AUTHENTICATION_FAILED'));
