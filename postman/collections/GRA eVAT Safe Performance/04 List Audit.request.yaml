$kind: http-request
url: '{{baseUrl}}/api/v1/audit?limit=10'
method: GET
queryParams:
  - key: limit
    value: '10'
auth:
  type: apikey
  credentials:
    - key: key
      value: X-API-Key
    - key: value
      value: '{{apiKey}}'
    - key: in
      value: header
scripts:
  - type: afterResponse
    code: |-
      pm.test('audit lookup is successful', () => pm.response.to.have.status(200));
order: 4000
